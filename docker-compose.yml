services:
  app:
    build: .
    restart: unless-stopped
    network_mode: host
    environment:
      PORT: ${APP_PORT:-3200}
      HOST: 127.0.0.1
      NODE_ENV: production
      TRUST_PROXY: ${TRUST_PROXY:-true}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://jlptquiz.in}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-japanesenx-aman}
      FIREBASE_SERVICE_ACCOUNT_BASE64: ${FIREBASE_SERVICE_ACCOUNT_BASE64:?Set FIREBASE_SERVICE_ACCOUNT_BASE64 in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      DEV_AUTH_BYPASS: "false"
